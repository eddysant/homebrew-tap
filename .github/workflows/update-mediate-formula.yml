name: Update mediate Formula

on:
  schedule:
    # Offset from the photo-slap cask schedule so the two jobs do not race each
    # other pushing to this repo.
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update the formula from the latest GitHub Release
        env:
          # The built-in token is enough: this workflow reads a public release and
          # commits to its own repository. No cross-repo PAT is involved.
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/update-mediate-formula.sh
      - name: Validate formula style
        run: brew style Formula/mediate.rb
      - name: Commit an updated formula
        run: |
          if git diff --quiet -- Formula/mediate.rb; then
            echo "Formula is already current"
            exit 0
          fi
          version="$(sed -n 's|.*/archive/refs/tags/v\([0-9][^"]*\)\.tar\.gz.*|\1|p' Formula/mediate.rb)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/mediate.rb
          git commit -m "Update mediate formula to ${version}"
          # A push to this repo between checkout and here — another updater,
          # or a commit made by hand — leaves this one stale and the push is
          # rejected. Each updater touches only its own file, so a concurrent
          # push is never a real conflict: rebase onto whatever landed and try
          # again. The cron times are staggered to make this rare, but a
          # manual push can land at any moment, which no stagger can prevent.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto origin/${GITHUB_REF_NAME}"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done
          git push
