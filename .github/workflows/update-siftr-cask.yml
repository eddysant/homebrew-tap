name: Update siftr

on:
  schedule:
    # Offset from the other two cask jobs so they do not race pushing here.
    - cron: "7 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update Cask from the latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/update-siftr-cask.sh
      - name: Validate style
        # The formula knowingly uses `post_install` over the preferred
        # declarative steps, which cannot express re-signing binaries, so its
        # style is not gated here.
        run: brew style Casks/siftr.rb
      - name: Commit an updated Cask
        run: |
          if git diff --quiet -- Casks/siftr.rb Formula/siftr.rb; then
            echo "Cask is already current"
            exit 0
          fi
          version="$(sed -n 's/^[[:space:]]*version "\([^"]*\)"/\1/p' Casks/siftr.rb)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/siftr.rb Formula/siftr.rb
          git commit -m "Update siftr to ${version}"
          # A push to this repo between checkout and here — another updater,
          # or a commit made by hand — leaves this one stale and the push is
          # rejected. Each updater touches only its own file, so a concurrent
          # push is never a real conflict: rebase onto whatever landed and try
          # again. The cron times are staggered to make this rare, but a
          # manual push can land at any moment, which no stagger can prevent.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto origin/${GITHUB_REF_NAME}"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done
          git push
